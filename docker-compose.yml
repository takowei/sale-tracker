# Deploy config for sale-tracker (bongo rootless Docker).
#
# Two services share one image and one data volume:
#   - web:     serves index.html + data/*.json over plain HTTP (no domain/
#              TLS here — same "backend-only, direct port" scope as
#              pricewatch/pricedrop's bongo deploys).
#   - scraper: runs run_scrapers.py once a day via scripts/cron_loop.sh
#              (n8n_workflow.json is not usable — n8n isn't installed on
#              the deploy target).
#
# Usage: docker compose up -d --build

services:
  web:
    build: .
    container_name: sale-tracker-web
    restart: unless-stopped
    volumes:
      - sale_tracker_data:/app/data
    ports:
      - "8090:8080"

  scraper:
    build: .
    container_name: sale-tracker-scraper
    restart: unless-stopped
    environment:
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-86400}
    command: ["bash", "scripts/cron_loop.sh"]
    volumes:
      - sale_tracker_data:/app/data

volumes:
  sale_tracker_data:
